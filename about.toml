# cargo-about: which licences the libraries built into the program may have, and
# the platforms the downloads are made for. Keep in step with deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
