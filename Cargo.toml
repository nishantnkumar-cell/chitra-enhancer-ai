[package]
name = "chitra-enhance"
version = "0.1.0"
description = "Chitra Enhancer AI: restore and upscale old, noisy video (and photos) with AI models, on your own GPU"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
fast_image_resize = "6.2.0"
half = { version = "2.7.1", optional = true }
indicatif = "0.18.6"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# AI models through ONNX Runtime (CUDA, DirectML, CoreML, CPU). Off by default so
# the program builds and runs without the ONNX Runtime library; the plain
# Lanczos upscaler is used then.
onnx = ["dep:ort", "dep:half"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
