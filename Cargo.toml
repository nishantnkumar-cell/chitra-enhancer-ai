[package]
name = "chitra-enhance"
version = "0.1.0"
description = "Chitra Enhancer AI: restore and upscale old, noisy video (and photos) with AI models, on your own GPU"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nishantnkumar-cell/chitra-enhancer-ai"
rust-version = "1.95"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"], optional = true }
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
getrandom = { version = "0.4.3", optional = true }
http-body-util = { version = "0.1", optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "fs", "io-util", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
fast_image_resize = { version = "6.2.0", features = ["rayon"] }
half = { version = "2.7.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
indicatif = "0.18.6"
jxl-encoder = { version = "0.3.1", default-features = false, features = ["std", "parallel"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "api-22", "ndarray", "half", "cuda", "directml", "coreml"], optional = true }
png = "0.18.1"
rayon = "1.12.0"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3"
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.8.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# AI models through ONNX Runtime (CUDA, DirectML, CoreML, CPU). Off by default so
# the program builds and runs without the ONNX Runtime library; the plain
# Lanczos upscaler is used then.
onnx = ["dep:ort", "dep:half"]
gui = ["dep:eframe", "dep:rfd"]
# `chitra-enhance serve`: enhance pictures and short clips for other computers on
# your Tailscale network, and `chitra-enhance remote` to send them.
server = ["dep:axum", "dep:windows-service", "dep:getrandom", "dep:http-body-util", "dep:subtle", "dep:tokio", "dep:tokio-util"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "chitra-enhance"
path = "src/main.rs"

[[bin]]
name = "chitra-enhance-gui"
path = "src/gui.rs"
required-features = ["gui"]
