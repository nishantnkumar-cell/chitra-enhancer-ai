# Runs each fuzz target (fuzz/) for a few minutes. A crash fails the run and its
# input is uploaded as an artifact.
name: Fuzz

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [inspect_jpeg, photo_decode, noise_gray, text_lines]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          secs="${{ github.event.inputs.seconds }}"
          if [ "${{ github.event_name }}" = pull_request ]; then secs=30; fi
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="${secs:-300}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
