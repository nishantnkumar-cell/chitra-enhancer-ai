name: Release
# Push a tag like v0.2.0 to build downloadable bundles and attach them to a DRAFT
# release (publish it by hand after a look). Run it manually to just get the
# bundles as workflow artifacts without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, ext: tar.gz }
          - { os: windows-latest, name: windows-x64, ext: zip }
          - { os: macos-latest, name: macos-arm64, ext: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features gui,onnx
      - name: Bundle
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME:-dev}"
          DIR="chitra-enhancer-ai-${VER}-${{ matrix.name }}"
          mkdir "$DIR"
          EXE=""; [ "${{ runner.os }}" = "Windows" ] && EXE=".exe"
          cp "target/release/chitra-enhance${EXE}" "target/release/chitra-enhance-gui${EXE}" "$DIR/"
          cp README.md LICENSE docs/MODEL_LICENCES.md "$DIR/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$DIR.zip" "$DIR" >/dev/null
          else
            tar czf "$DIR.tar.gz" "$DIR"
          fi
          sha256sum "$DIR.${{ matrix.ext }}" > "$DIR.${{ matrix.ext }}.sha256" || shasum -a 256 "$DIR.${{ matrix.ext }}" > "$DIR.${{ matrix.ext }}.sha256"
          ls -l chitra-enhancer-ai-*
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: |
            chitra-enhancer-ai-*.${{ matrix.ext }}
            chitra-enhancer-ai-*.sha256

  draft-release:
    name: draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "Chitra Enhancer AI $GITHUB_REF_NAME"
